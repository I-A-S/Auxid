name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [x64-linux]
        
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Clang 20
        if: matrix.target == 'x64-linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo ln -sf /usr/bin/clang-20   /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-20 /usr/bin/clang++
          clang --version
          clang++ --version

      - name: Install GCC 15
        if: matrix.target == 'x64-linux-gcc'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15
          gcc-15 --version
          g++-15 --version

      - name: Configure
        run: cmake --preset ${{ matrix.target }}

      - name: Build
        run: cmake --build --preset ${{ matrix.target }} --config Release

      - name: Test
        run: ctest --preset ${{ matrix.target }} --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}-Release
          path: out/build/${{ matrix.target }}/Release/
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [arm64-darwin]

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM and Ninja
        run: |
          brew install llvm ninja
          $(brew --prefix llvm)/bin/clang --version
          $(brew --prefix llvm)/bin/clang++ --version

      - name: Configure
        run: cmake --preset ${{ matrix.target }}

      - name: Build
        run: cmake --build --preset ${{ matrix.target }} --config Release

      - name: Test
        run: ctest --preset ${{ matrix.target }} --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}-Release
          path: out/build/${{ matrix.target }}/Release/
          if-no-files-found: error

  sanitizers-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        preset: [x64-linux-asan, x64-linux-ubsan, x64-linux-tsan]

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Clang 20
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo ln -sf /usr/bin/clang-20   /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-20 /usr/bin/clang++
          clang --version
          clang++ --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --config RelWithDebInfo

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [x64-windows-msvc]

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.target }}

      - name: Build
        run: cmake --build --preset ${{ matrix.target }} --config Release

      - name: Test
        run: ctest --preset ${{ matrix.target }} --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}-Release
          path: out/build/${{ matrix.target }}/Release/
          if-no-files-found: error

  build-windows-clang-shared:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM and Ninja
        run: choco install llvm ninja -y

      - name: Ensure Chocolatey LLVM on PATH
        run: |
          echo "PATH=C:\Program Files\LLVM\bin;$env:PATH" >> $env:GITHUB_ENV
          & "C:\Program Files\LLVM\bin\clang.exe" --version
          & "C:\Program Files\LLVM\bin\clang++.exe" --version

      - name: Configure
        run: cmake --preset x64-windows-clang-shared

      - name: Build
        run: cmake --build --preset x64-windows-clang-shared --config Release

      - name: Test
        run: ctest --preset x64-windows-clang-shared --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-clang-shared-Release
          path: out/build/x64-windows-clang-shared/Release/
          if-no-files-found: error

  build-windows-mingw:
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: cmake --preset x64-windows-mingw-gcc

      - name: Build
        shell: msys2 {0}
        run: cmake --build --preset x64-windows-mingw-gcc --config Release

      - name: Test
        shell: msys2 {0}
        run: ctest --preset x64-windows-mingw-gcc --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-mingw-Release
          path: out/build/x64-windows-mingw-gcc/Release/
          if-no-files-found: error

  build-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: emcmake cmake --preset wasm32-emscripten
        env:
          EMSDK: ${{ env.EMSDK }}

      - name: Build
        run: cmake --build --preset wasm32-emscripten --config Release

      - name: Test
        run: ctest --preset wasm32-emscripten --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-Release
          path: out/build/wasm32-emscripten/Release/
          if-no-files-found: error
